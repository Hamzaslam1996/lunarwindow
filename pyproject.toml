[project]
name = "lunarwindow"
version = "0.1.0"
description = "Compare lunar south-pole landing sites and dates: Sun/Earth elevation over the local horizon, illumination, power potential and direct-to-Earth comms windows. NASA Space Apps 2026 — CLPS Lunar Mission Browser."
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Hamza Aslam" }]
dependencies = [
    "spiceypy>=6.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "rasterio>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunarwindow"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=lunarwindow --cov-report=term-missing"
